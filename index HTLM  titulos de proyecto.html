<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>titulo_proyecto – Titulador de proyectos</title>
<style>
:root{--bg:#f4f6fb;--card:#fff;--tx:#1b2230;--mu:#5b6578;--ac:#1d4ed8;--bd:#d9dfec}
@media (prefers-color-scheme:dark){:root{--bg:#10141c;--card:#1a2030;--tx:#e8ecf5;--mu:#9aa5bb;--ac:#6b9bff;--bd:#2c3550}}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--tx);line-height:1.45}
header{padding:18px 20px;border-bottom:1px solid var(--bd);background:var(--card)}
h1{margin:0;font-size:1.25rem}header p{margin:4px 0 0;color:var(--mu);font-size:.9rem}
main{max-width:1000px;margin:auto;padding:16px;display:grid;gap:16px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
label{display:block;font-size:.82rem;font-weight:600;margin-bottom:4px}
input,select,textarea{width:100%;padding:8px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit}
button{background:var(--ac);color:#fff;border:0;border-radius:8px;padding:10px 16px;font:inherit;font-weight:600;cursor:pointer;margin:12px 8px 0 0}
button.sec{background:transparent;color:var(--ac);border:1px solid var(--ac);padding:6px 10px;margin:8px 0 0}
h2{font-size:1rem;margin:0 0 10px}
.t{border:1px solid var(--bd);border-radius:8px;padding:10px;margin-bottom:10px;background:var(--bg)}
.t small{color:var(--mu);display:block;margin-bottom:4px;font-weight:600}
.cred{font-size:.82rem;color:var(--mu)}
</style>
</head>
<body>
<header>
<h1>Titulador de proyectos</h1>
<p>Nivel correlacional y explicativo · Bivariadas y multivariadas · Escuela de Administración, UNASAM</p>
</header>
<main>
<section class="card">
<h2>1. Datos del proyecto</h2>
<div class="grid">
<div><label>Autor(es) del proyecto</label><input id="autor" placeholder="Nombres y apellidos"></div>
<div><label>Nivel</label>
<select id="nivel"><option value="cor">Correlacional</option><option value="exp">Explicativo</option></select></div>
<div><label>Organización / Empresa</label><input id="org" placeholder="Ej. Municipalidad Provincial de Huaraz"></div>
<div><label>Población</label><input id="pob" placeholder="Ej. los trabajadores"></div>
<div><label>Ámbito geográfico</label><input id="geo" placeholder="Ej. Huaraz, Áncash"></div>
<div><label>Año</label><input id="anio" placeholder="2026"></div>
</div>
</section>
<section class="card">
<h2>2. Variables</h2>
<div class="grid">
<div><label>Variable 1 (V1) – independiente</label><input id="v1" placeholder="Ej. liderazgo"></div>
<div><label>Variable 2 (V2) – dependiente</label><input id="v2" placeholder="Ej. desempeño laboral"></div>
<div><label>Variable 3 (opcional, multivariada)</label><input id="v3" placeholder="Ej. clima organizacional"></div>
<div><label>Dimensión de V2 (opcional)</label><input id="dim" placeholder="Ej. eficiencia"></div>
</div>
<button onclick="generar()">Generar títulos</button>
<button class="sec" onclick="ejemplo()">Cargar ejemplo</button>
</section>
<section class="card" id="out" style="display:none">
<h2>3. Títulos propuestos</h2>
<div id="lista"></div>
<p class="cred" id="cred"></p>
</section>
</main>
<script>
const $=id=>document.getElementById(id);
const esc=s=>s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const cap=s=>s.charAt(0).toUpperCase()+s.slice(1);
const lista=a=>a.length<2?(a[0]||''):a.slice(0,-1).join(', ')+' y '+a[a.length-1];
function generar(){
 const v1=$('v1').value.trim(),v2=$('v2').value.trim(),v3=$('v3').value.trim(),dim=$('dim').value.trim();
 if(!v1||!v2){alert('Escribe al menos V1 y V2');return}
 const ctx=[$('pob').value.trim(),$('org').value.trim()?'de '+$('org').value.trim():'',$('geo').value.trim(),$('anio').value.trim()].filter(Boolean).join(', ');
 const c=ctx?' en '+ctx:'';
 const cor=$('nivel').value==='cor';
 const dep=dim?`la dimensión ${dim} de ${v2}`:v2;
 const ind=v3?[v1,v3]:[v1];
 let T=[];
 if(cor){
  const L=lista(v3?[v1,dep,v3]:[v1,dep]);
  T=[`Relación entre ${L}${c}`,
     `Correlación entre ${L}${c}`,
     `Asociación entre ${L}${c}`,
     `${cap(v1)} y su relación con ${dep}${v3?' y '+v3:''}${c}`];
 }else{
  T=[`Influencia de ${lista(ind)} en ${dep}${c}`,
     `Efecto de ${lista(ind)} sobre ${dep}${c}`,
     `Impacto de ${lista(ind)} en ${dep}${c}`,
     `${cap(lista(ind))} como determinante de ${dep}${c}`];
 }
 const tipo=(cor?'Correlacional':'Explicativo')+' · '+(v3?'Multivariado':'Bivariado');
 $('lista').innerHTML=T.map((t,i)=>`<div class="t"><small>Opción ${i+1} · ${tipo}</small><span>${esc(t)}</span><br><button class="sec" onclick="cp(${i})">Copiar</button></div>`).join('');
 window._T=T;
 $('cred').innerHTML=`<b>Créditos:</b> Proyecto de ${esc($('autor').value||'[autor]')}. Estructura de títulos según Hernández-Sampieri (HS), Vara-Horna (AVH) y Villanueva (LV). Escuela de Administración, UNASAM.`;
 $('out').style.display='block';$('out').scrollIntoView({behavior:'smooth'});
}
function cp(i){navigator.clipboard.writeText(window._T[i]).then(()=>alert('Copiado'),()=>prompt('Copia manualmente:',window._T[i]))}
function ejemplo(){
 $('autor').value='Tu nombre';$('org').value='Municipalidad Provincial de Huaraz';$('pob').value='los trabajadores';
 $('geo').value='Huaraz, Áncash';$('anio').value='2026';$('v1').value='el liderazgo';$('v2').value='el desempeño laboral';
 $('v3').value='';$('dim').value='';
}
</script>
</body>
</html>
